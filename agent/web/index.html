<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary": "#ffffff", "on-error": "#ffffff", "primary": "#000000", "surface-dim": "#d8dadc", "on-secondary-fixed": "#00174b", "outline-variant": "#c6c6cd", "on-primary-container": "#7c839b", "surface-container-low": "#f2f4f6", "secondary-container": "#316bf3", "secondary-fixed-dim": "#b4c5ff", "primary-container": "#131b2e", "surface-tint": "#565e74", "secondary-fixed": "#dbe1ff", "inverse-on-surface": "#eff1f3", "on-primary-fixed-variant": "#3f465c", "inverse-primary": "#bec6e0", "on-secondary-container": "#fefcff", "surface": "#f7f9fb", "on-error-container": "#93000a", "inverse-surface": "#2d3133", "secondary": "#0051d5", "tertiary-fixed-dim": "#b7c8e1", "tertiary": "#000000", "surface-bright": "#f7f9fb", "on-primary-fixed": "#131b2e", "primary-fixed": "#dae2fd", "surface-container-lowest": "#ffffff", "surface-container": "#eceef0", "error": "#ba1a1a", "on-primary-fixed": "#131b2e", "primary-fixed-dim": "#bec6e0", "surface-variant": "#e0e3e5", "tertiary-container": "#0b1c30", "on-tertiary-fixed": "#0b1c30", "on-tertiary": "#ffffff", "on-secondary-fixed-variant": "#003ea8", "on-surface": "#191c1e", "background": "#f7f9fb", "on-tertiary-fixed-variant": "#38485d", "outline": "#76777d", "on-background": "#191c1e", "surface-container-high": "#e6e8ea", "on-secondary": "#ffffff", "surface-container-highest": "#e0e3e5", "tertiary-fixed": "#d3e4fe", "error-container": "#ffdad6", "on-surface-variant": "#45464d" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "gutter-mobile": "0.75rem", "space-lg": "1.5rem", "margin-mobile": "1rem", "gutter": "1.5rem", "margin": "2rem", "space-sm": "0.5rem" }, fontFamily: { "display-lg": ["Geist"], "body-md": ["Geist"], "headline-lg": ["Geist"], "label-md": ["JetBrains Mono"], "body-lg": ["Geist"], "body-sm": ["Geist"], "label-sm": ["JetBrains Mono"], "headline-sm": ["Geist"], "headline-md": ["Geist"], "display-lg-mobile": ["Geist"] }, fontSize: { "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.025em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }] } } } };</script><style>
/* EpiGuard wiring: chat history + message bubbles (works even if the CDN is blocked) */
#chat-history{display:none;flex-direction:column;gap:12px;width:100%;max-width:48rem;margin:0 auto 16px;text-align:left}
#chat-history.on{display:flex}
.msg{border-radius:12px;padding:12px 16px;max-width:100%;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7}
.msg.me{background:#131b2e;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;max-width:85%}
.msg.bot{background:#f2f4f6;color:#191c1e;align-self:flex-start;border:1px solid #e0e3e5;border-bottom-left-radius:4px;max-width:100%;width:100%}
.msg .meta{font-size:11px;color:#7c839b;margin-top:8px;font-family:"JetBrains Mono",monospace}
.msg .meta b{color:#0051d5}
.msg a{color:#0051d5}
#ground-btn.grounded{background:#dbe1ff !important;color:#0051d5 !important}
.testchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}

.typing{opacity:.6}
</style></head><body class="bg-surface-container-lowest font-body-md text-on-surface antialiased"><aside class="fixed left-0 top-0 h-full w-64 bg-surface-container-lowest border-r border-surface-variant z-50 flex flex-col justify-between"><div class="flex flex-col p-space-md"><div class="flex items-center gap-space-sm h-10 px-space-xs mb-space-md"><span class="material-symbols-outlined text-[28px]">asterisk</span><span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Nova AI · EpiGuard</span></div><button id="new-chat" class="flex items-center justify-between w-full h-10 px-space-md bg-surface-container-low hover:bg-surface-container hover:text-on-surface border border-surface-variant rounded-lg font-body-sm text-body-sm text-on-surface transition-colors mb-space-lg" type="button"><span class="flex items-center gap-space-sm"><span class="material-symbols-outlined text-[18px]">add</span><span>New Chat</span></span><span class="font-label-sm text-label-sm text-on-surface-variant">⌘N</span></button><div id="past-chats" style="display:flex;flex-direction:column;gap:4px;margin-top:4px;max-height:50vh;overflow:auto"></div></div></aside><div class="pl-64"><header class="fixed top-0 left-64 right-0 h-16 bg-surface-container-lowest/90 backdrop-blur-md border-b border-surface-variant z-40 flex items-center justify-between px-gutter"><div class="flex items-center gap-space-md"><div class="flex items-center gap-space-xs font-label-md text-label-md text-on-surface-variant"><span class="material-symbols-outlined text-[18px] text-on-surface-variant">grid_view</span></div></div><div class="flex items-center gap-space-lg"><nav class="hidden md:flex items-center gap-space-md" data-active-classes="bg-surface-container text-on-surface font-headline-sm"></nav></div></header><main class="relative pt-16 w-full min-h-screen bg-surface-container-lowest"><div class="flex flex-col w-full">
<section class="relative w-full min-h-[calc(100vh-4rem)] flex flex-col justify-between px-space-md lg:px-space-xl overflow-hidden select-none">
<div class="absolute inset-0 pointer-events-none opacity-40" style="background-image: radial-gradient(#d8dadc 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="relative z-10 w-full max-w-3xl mx-auto my-auto flex flex-col items-center text-center px-space-sm py-space-xl">
<div class="w-14 h-14 rounded-xl bg-surface-container-low flex items-center justify-center shadow-sm mb-space-lg group transition-transform duration-300 hover:scale-105">
<span class="material-symbols-outlined text-[28px] text-on-surface transition-transform duration-500 group-hover:rotate-45">asterisk</span>
</div>

<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-sm">
        How can I help you today?
      </h1>

<div id="chat-history"></div>

</div>
<div class="relative z-20 w-full max-w-3xl mx-auto pb-space-lg">
<div class="bg-surface-container-lowest rounded-xl shadow-xl shadow-surface-dim/40 p-space-sm flex flex-col gap-space-xs transition-shadow duration-200 focus-within:shadow-2xl">
<div class="flex items-center gap-space-sm px-space-xs">
<textarea class="w-full bg-transparent resize-none outline-none font-body-md text-body-md text-on-surface placeholder:text-outline-variant py-2.5 max-h-40 overflow-y-auto leading-relaxed" id="prompt-input" placeholder="" rows="1"></textarea>
</div>
<div class="flex items-center justify-between pt-space-xs border-t border-surface-container-low">
<div class="flex items-center gap-0.5">




<div class="flex items-center gap-space-xs">
<button id="mic-btn" class="w-8 h-8 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface transition-colors" title="Voice Dictation" type="button">
<span class="material-symbols-outlined text-[19px]">mic</span>
</button>
<button class="h-8 px-3 rounded-lg bg-surface-container-high text-on-primary-container font-body-sm text-body-sm flex items-center justify-center gap-1 cursor-not-allowed transition-all duration-200" disabled="" id="send-button" type="button">
<span class="hidden sm:inline font-medium">Send</span>
<span class="material-symbols-outlined text-[16px]">arrow_upward</span>
</button>
</div>
</div>
</div>
</div>
</section>
</div>
<script>
  (function() {
    const textarea = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-button');
    const hist = document.getElementById('chat-history');
    const grounded = true; // web grounding always ON (toggle removed)
    let busy = false;

    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function bubble(cls, html, meta){
      hist.classList.add('on');
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.innerHTML = html + (meta ? '<div class="meta">' + meta + '</div>' : '');
      hist.appendChild(d);
      d.scrollIntoView({behavior:'smooth', block:'nearest'});
      return d;
    }
    function renderAnswer(d){
      let h = '';
      if (d.category === 'unsafe_advice')
        h += '<div style="display:inline-block;background:#ffdad6;color:#93000a;border-radius:9999px;padding:4px 14px;font-size:13px;font-weight:600;margin-bottom:8px">⛔ نصيحة صحية خطرة</div><br>';
      else if (d.category === 'urgent_care')
        h += '<div style="display:inline-block;background:#ba1a1a;color:#fff;border-radius:9999px;padding:4px 14px;font-size:13px;font-weight:600;margin-bottom:8px">🚨 حالة قد تكون طارئة</div><br>';
      else if (d.category === 'needs_human_review')
        h += '<div style="display:inline-block;background:#fff3c4;color:#7a5c00;border-radius:9999px;padding:4px 14px;font-size:13px;font-weight:600;margin-bottom:8px">🟡 يحتاج مراجعة بشرية</div><br>';
      else if (d.verdict === 'rumor')
        h += '<div style="display:inline-block;background:#ffdad6;color:#93000a;border-radius:9999px;padding:4px 14px;font-size:13px;font-weight:600;margin-bottom:8px">❌ شائعة — معلومة مضللة</div><br>';
      else if (d.verdict === 'supported')
        h += '<div style="display:inline-block;background:#d3f8df;color:#0b5c2e;border-radius:9999px;padding:4px 14px;font-size:13px;font-weight:600;margin-bottom:8px">✅ معلومة صحيحة ومدعومة</div><br>';
      else if (d.verdict === 'unverified') {
        let badge = '⚠️ غير مؤكد';
        if (d.lean_pct !== undefined && (d.lean_pct >= 65 || d.lean_pct <= 35))
          badge += ' — يميل ' + d.lean_pct + '% للتفنيد';
        else if (d.lean_pct !== undefined)
          badge += ' (محايد ' + d.lean_pct + '%)';
        h += '<div style="display:inline-block;background:#fff3c4;color:#7a5c00;border-radius:9999px;padding:4px 14px;font-size:13px;font-weight:600;margin-bottom:8px">' + badge + '</div><br>';
      }
      h += esc(d.answer).replace(/\n/g, '<br>');
      if (d.category === 'needs_human_review')
        h += '<div style="margin-top:10px;padding:8px 10px;border:1px solid #f0d98a;border-radius:8px;background:#fffaf0;font-size:12px">هذه الحالة لم تحصل على دليل حاسم؛ لا تستخدمها لاتخاذ قرار صحي قبل مراجعة المصدر أو مختص.</div>';
      if (d.category === 'urgent_care')
        h += '<div style="margin-top:10px;padding:8px 10px;border:1px solid #ba1a1a;border-radius:8px;background:#fff0f0;color:#93000a;font-size:12px">لا تعتمد على هذه الأداة في الطوارئ. اتصل بالطوارئ المحلية الآن.</div>';
      if (d.confidence !== undefined) {
        const pct = Math.max(0, Math.min(100, Math.round(d.confidence * 100)));
        h += '<div style="margin-top:12px;font-size:12px;color:#45464d">درجة الثقة: ' + pct + '%</div>' +
          '<div style="height:8px;background:#e6e8ea;border-radius:9999px;overflow:hidden;margin-top:4px">' +
          '<div style="height:100%;width:' + pct + '%;background:' +
          (pct >= 70 ? '#2e7d32' : pct >= 45 ? '#d99b00' : '#ba1a1a') +
          ';"></div></div>';
      }
      if (d.evidence_grade)
        h += '<div style="margin-top:8px;font-size:12px;color:#45464d">🔎 ' + esc(d.evidence_grade) + '</div>';
      if (d.sources && d.sources.length)
        h += '<br><br>📚 ' + d.sources.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>').join(' · ');
      if (d.citation)
        h += '<br>🔗 <a href="' + esc(d.citation) + '" target="_blank" rel="noopener">' + esc(d.citation) + '</a>';
      if (d.web_evidence)
        h += '<br><br>🌐 ' + esc(d.web_evidence);
      const meta = 'mode=<b>' + esc(d.mode) + '</b> · ' + esc(d.verification || '') +
        (d.elapsed_s !== undefined ? ' · ⏱ ' + d.elapsed_s + 's' : '');
      h += '<div style="margin-top:12px"><button type="button" data-feedback="wrong" style="font-size:12px;padding:5px 10px;border:1px solid #c6c6cd;border-radius:9999px;background:#fff;cursor:pointer">الحكم ده غلط</button></div>';
      return {h, meta};
    }
    async function doSend(){
      const text = textarea.value.trim();
      if (!text || busy) return;
      busy = true;
      textarea.value = ''; updateState();
      bubble('me', esc(text));
      const wait = bubble('bot', '<span class="typing">plan → tools → verify…</span>');
      try {
        const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({text, web: grounded, session: SID})});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        if (d.session) { SID = d.session; try{localStorage.setItem('epiguard_sid', SID);}catch(e){} }
        const {h, meta} = renderAnswer(d);
        wait.innerHTML = h + '<div class="meta">' + meta + '</div>';
        const feedback = wait.querySelector('[data-feedback="wrong"]');
        if (feedback) feedback.onclick = async () => {
          feedback.disabled = true;
          await fetch('/api/feedback', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({claim: text, verdict: d.verdict, correct: false, session: SID})});
          feedback.textContent = 'تم تسجيل المراجعة';
        };
        refreshSessions();
      } catch(e) {
        wait.innerHTML = 'Connection error: ' + esc(String(e)) + '<br>Is the server running? <b>py agent/server.py</b>';
      }
      busy = false;
    }

    // ---- saved conversations (server-side sessions) ----
    let SID = '';
    try { SID = localStorage.getItem('epiguard_sid') || ''; } catch(e) {}
    async function refreshSessions(){
      try {
        const r = await fetch('/api/sessions');
        const list = await r.json();
        const box = document.getElementById('past-chats');
        box.innerHTML = '';
        list.slice(0, 12).forEach(s => {
          const b = document.createElement('button');
          b.type = 'button';
          b.title = (s.first || 'محادثة') + ' (' + s.turns + ')';
          b.style.cssText = 'text-align:right;font-size:12px;padding:6px 10px;border-radius:8px;background:' + (s.sid === SID ? '#dbe1ff' : '#f2f4f6') + ';border:1px solid #e0e3e5;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
          b.textContent = (s.first || 'محادثة فارغة').slice(0, 28);
          b.onclick = () => loadSession(s.sid);
          box.appendChild(b);
        });
      } catch(e) {}
    }
    async function loadSession(sid){
      try {
        const r = await fetch('/api/history?session=' + encodeURIComponent(sid));
        const d = await r.json();
        SID = d.session;
        try{localStorage.setItem('epiguard_sid', SID);}catch(e){}
        hist.innerHTML = ''; hist.classList.add('on');
        (d.turns || []).forEach(t => {
          bubble('me', esc(t.input || ''));
          const fake = {answer: t.answer || '', mode: t.mode, verification: '', sources: []};
          const {h, meta} = renderAnswer(fake);
          bubble('bot', h);
        });
        refreshSessions();
      } catch(e) {}
    }
    function newSid(){
      const a = new Uint8Array(8);
      crypto.getRandomValues(a);
      return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
    }

    const updateState = () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
      const hasValue = textarea.value.trim().length > 0;
      if (hasValue) {
        sendBtn.disabled = false;
        sendBtn.classList.remove('bg-surface-container-high', 'text-on-primary-container', 'cursor-not-allowed');
        sendBtn.classList.add('bg-primary', 'text-on-primary', 'cursor-pointer', 'hover:bg-inverse-surface');
      } else {
        sendBtn.disabled = true;
        sendBtn.classList.add('bg-surface-container-high', 'text-on-primary-container', 'cursor-not-allowed');
        sendBtn.classList.remove('bg-primary', 'text-on-primary', 'cursor-pointer', 'hover:bg-inverse-surface');
      }
    };

    textarea.addEventListener('input', updateState);
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });
    sendBtn.addEventListener('click', doSend);
    document.getElementById('new-chat').addEventListener('click', () => {
      hist.innerHTML = ''; hist.classList.remove('on');
      SID = newSid();
      try{localStorage.setItem('epiguard_sid', SID);}catch(e){}
      refreshSessions();
    });
    refreshSessions();

    // ---- voice input (Web Speech API, Arabic Egypt) ----
    const micBtn = document.getElementById('mic-btn');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, listening = false;
    function setMic(on){
      listening = on;
      micBtn.style.background = on ? '#ba1a1a' : '';
      micBtn.style.color = on ? '#fff' : '';
      micBtn.title = on ? 'جارٍ الاستماع… دوس للإيقاف' : 'تحدث بالصوت (عربي)';
    }
    if (!SR) {
      micBtn.title = 'المتصفح لا يدعم التسجيل الصوتي — استخدم Chrome أو Edge';
      micBtn.style.opacity = '0.4';
    } else {
      micBtn.addEventListener('click', () => {
        if (listening) { rec.stop(); return; }
        rec = new SR();
        rec.lang = 'ar-EG';
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        rec.onresult = (e) => {
          let interim = '', fin = '';
          for (const r of e.results) {
            if (r.isFinal) fin += r[0].transcript;
            else interim += r[0].transcript;
          }
          if (fin) {
            textarea.value = (textarea.value + ' ' + fin).trim();
            updateState();
            doSend();
          } else {
            textarea.placeholder = interim;
          }
        };
        rec.onend = () => { setMic(false); textarea.placeholder = textarea.dataset.ph || textarea.placeholder; };
        rec.onerror = (e) => { setMic(false); if (e.error === 'not-allowed') alert('اسمح بالميكروفون من المتصفح الأول'); };
        try { rec.start(); setMic(true); } catch (e) { setMic(false); }
      });
    }

    // backend warmup ping (no status pill anymore; failures surface on send)
    fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: 'ping', web: false})}).catch(() => {});
  })();
</script></main></div></body></html>
